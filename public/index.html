<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车辆台账登记</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
    body{padding:20px;background:#f5f7fa}
    .container{max-width:1200px;margin:0 auto}
    h1{margin-bottom:20px;color:#222;font-size:22px}
    .form-card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px #00000012;margin-bottom:20px}
    .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
    input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}
    button{padding:10px 20px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px #00000012}
    th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
    th{background:#f1f5f9}
    .del-btn{background:#dc2626}
    .edit-btn{background:#059669;margin-right:6px}
  </style>
</head>
<body>
<div class="container">
  <h1>车辆台账登记</h1>
  <div class="form-card">
    <div class="row">
      <input id="orderNo" placeholder="订单号">
      <input id="contractNo" placeholder="合同号">
      <input id="model" placeholder="车型">
      <input id="vin" placeholder="VIN">
      <input id="chassis" placeholder="底盘号">
      <input id="cfr" placeholder="CFR">
    </div>
    <div class="row">
      <textarea id="remark" placeholder="备注"></textarea>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <button onclick="addData()">新增记录</button>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>订单号</th>
        <th>合同号</th>
        <th>车型</th>
        <th>VIN</th>
        <th>底盘号</th>
        <th>CFR</th>
        <th>备注</th>
        <th>时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
const api = "/api";
let listData = [];

async function loadList(){
  const res = await fetch(`${api}/list`);
  listData = await res.json();
  renderTable();
}

function renderTable(){
  const tb = document.getElementById("tableBody");
  tb.innerHTML = "";
  listData.forEach(item=>{
    tb.innerHTML += `
    <tr>
      <td>${item.id}</td>
      <td>${item.orderNo||""}</td>
      <td>${item.contractNo||""}</td>
      <td>${item.model||""}</td>
      <td>${item.vin||""}</td>
      <td>${item.chassis||""}</td>
      <td>${item.cfr||""}</td>
      <td>${item.remark||""}</td>
      <td>${item.createTime||""}</td>
      <td>
        <button class="del-btn" onclick="del(${item.id})">删除</button>
      </td>
    </tr>
    `
  })
}

async function addData(){
  const data = {
    orderNo: document.getElementById("orderNo").value.trim(),
    contractNo: document.getElementById("contractNo").value.trim(),
    model: document.getElementById("model").value.trim(),
    vin: document.getElementById("vin").value.trim(),
    chassis: document.getElementById("chassis").value.trim(),
    cfr: document.getElementById("cfr").value.trim(),
    remark: document.getElementById("remark").value.trim()
  }
  await fetch(`${api}/add`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  })
  clearInput();
  loadList();
}

async function del(id){
  if(!confirm("确定删除？")) return;
  await fetch(`${api}/del/${id}`,{method:"DELETE"})
  loadList();
}

function clearInput(){
  document.getElementById("orderNo").value=""
  document.getElementById("contractNo").value=""
  document.getElementById("model").value=""
  document.getElementById("vin").value=""
  document.getElementById("chassis").value=""
  document.getElementById("cfr").value=""
  document.getElementById("remark").value=""
}

loadList();
</script>
</body>
</html>
